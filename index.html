<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC Blueprint Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/v4-shims.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#5865F2',
                        secondary: '#23272A',
                        accent: '#FEE75C',
                        dark: '#1E1E24',
                        light: '#F5F5F7'
                    },
                    fontFamily: {
                        minecraft: ['Minecraft', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .scrollbar-thin {
                scrollbar-width: thin;
                scrollbar-color: #5865F2 #23272A;
            }
            .scrollbar-thin::-webkit-scrollbar {
                width: 6px;
            }
            .scrollbar-thin::-webkit-scrollbar-track {
                background: #23272A;
            }
            .scrollbar-thin::-webkit-scrollbar-thumb {
                background: #5865F2;
                border-radius: 3px;
            }
        }
    </style>
</head>
<body class="bg-dark text-light font-sans flex flex-col h-screen overflow-hidden">
    <!-- Header -->
    <header class="bg-secondary p-4 flex justify-between items-center shadow-lg">
        <h1 class="text-2xl font-bold text-accent">MC Blueprint Editor</h1>
        <div class="flex gap-2">
            <button id="exportBtn" class="bg-primary hover:bg-blue-600 px-4 py-2 rounded-lg flex items-center gap-2 transition-colors">
                <i class="fas fa-download"></i> Export
            </button>
            <label for="importFile" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded-lg flex items-center gap-2 transition-colors cursor-pointer">
                <i class="fas fa-upload"></i> Import
            </label>
            <input type="file" id="importFile" accept=".json" class="hidden">
            <button id="undoBtn" class="bg-yellow-600 hover:bg-yellow-700 px-4 py-2 rounded-lg flex items-center gap-2 transition-colors">
                <i class="fas fa-undo"></i> Undo
            </button>
            <button id="clearBtn" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg flex items-center gap-2 transition-colors">
                <i class="fas fa-trash"></i> Clear
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-secondary p-4 border-r border-gray-600 flex flex-col">
            <!-- Block Palette -->
            <div class="mb-6">
                <h2 class="text-lg font-semibold mb-3 text-accent">Block Palette</h2>
                <div id="blockPalette" class="grid grid-cols-4 gap-2 max-h-64 overflow-y-auto scrollbar-thin">
                    <!-- Blocks will be generated here -->
                </div>
            </div>

            <!-- Layer Controls -->
            <div class="flex-1">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-lg font-semibold text-accent">Layers</h2>
                    <button id="addLayerBtn" class="bg-primary hover:bg-blue-600 p-2 rounded transition-colors">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                <div id="layersList" class="space-y-2 max-h-80 overflow-y-auto scrollbar-thin">
                    <!-- Layers will be generated here -->
                </div>
            </div>
        </aside>

        <!-- Canvas Area -->
        <div class="flex-1 flex flex-col items-center justify-center p-4 overflow-hidden">
            <div class="relative border-2 border-gray-600 bg-gray-800">
                <canvas id="canvas" width="800" height="600" class="block cursor-crosshair"></canvas>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-secondary p-4 flex justify-between items-center border-t border-gray-600">
        <div id="stats" class="text-sm">
            Total Blocks: 0 | Current Layer: 0
        </div>
        <div class="text-sm text-gray-400">
            Left Click: Place Block | Right Click: Remove Block
        </div>
    </footer>

    <script>
        // Configuration
        const GRID_SIZE = 16; // Size of each grid cell in pixels
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 600;

        // Block definitions (ID, Name, Color)
        const BLOCKS = [
            { id: 'stone', name: 'Stone', color: '#808080' },
            { id: 'grass', name: 'Grass Block', color: '#7CFC00' },
            { id: 'dirt', name: 'Dirt', color: '#8B4513' },
            { id: 'cobblestone', name: 'Cobblestone', color: '#707070' },
            { id: 'wood', name: 'Wood Planks', color: '#A0522D' },
            { id: 'leaves', name: 'Leaves', color: '#228B22' },
            { id: 'glass', name: 'Glass', color: '#E0FFFF', alpha: 0.7 },
            { id: 'redstone', name: 'Redstone Block', color: '#DC143C' },
            { id: 'gold', name: 'Gold Block', color: '#FFD700' },
            { id: 'diamond', name: 'Diamond Block', color: '#00BFFF' },
            { id: 'iron', name: 'Iron Block', color: '#C0C0C0' },
            { id: 'brick', name: 'Brick', color: '#B22222' },
            { id: 'obsidian', name: 'Obsidian', color: '#4B0082' },
            { id: 'bedrock', name: 'Bedrock', color: '#2F2F2F' },
            { id: 'sand', name: 'Sand', color: '#F4A460' },
            { id: 'gravel', name: 'Gravel', color: '#696969' },
        ];

        // Application State
        let state = {
            canvas: null,
            ctx: null,
            selectedBlock: BLOCKS[0].id,
            layers: [
                { id: 'layer-1', name: 'Layer 1', visible: true, blocks: {} }
            ],
            currentLayerIndex: 0,
            isDrawing: false,
            isErasing: false,
            history: [],
            historyIndex: -1
        };

        // Initialize the application
        function init() {
            state.canvas = document.getElementById('canvas');
            state.ctx = state.canvas.getContext('2d');
            
            // Set canvas size (optional, can be dynamic)
            state.canvas.width = CANVAS_WIDTH;
            state.canvas.height = CANVAS_HEIGHT;

            initBlockPalette();
            initLayerControls();
            initCanvasEvents();
            initControlButtons();
            saveStateToHistory(); // Initial state
            render();
        }

        // Initialize Block Palette
        function initBlockPalette() {
            const palette = document.getElementById('blockPalette');
            BLOCKS.forEach(block => {
                const blockElement = document.createElement('div');
                blockElement.className = `w-10 h-10 rounded cursor-pointer border-2 transition-all ${block.id === state.selectedBlock ? 'border-accent scale-110' : 'border-transparent'}`;
                blockElement.style.backgroundColor = block.color;
                if (block.alpha) blockElement.style.opacity = block.alpha;
                blockElement.title = block.name;
                blockElement.addEventListener('click', () => selectBlock(block.id));
                palette.appendChild(blockElement);
            });
        }

        // Select a block
        function selectBlock(blockId) {
            state.selectedBlock = blockId;
            
            // Update UI
            document.querySelectorAll('#blockPalette > div').forEach(el => {
                el.classList.remove('border-accent', 'scale-110');
                el.classList.add('border-transparent');
            });
            event.target.classList.remove('border-transparent');
            event.target.classList.add('border-accent', 'scale-110');
        }

        // Initialize Layer Controls
        function initLayerControls() {
            renderLayersList();
            
            document.getElementById('addLayerBtn').addEventListener('click', addLayer);
        }

        // Render Layers List
        function renderLayersList() {
            const layersList = document.getElementById('layersList');
            layersList.innerHTML = '';

            state.layers.forEach((layer, index) => {
                const layerElement = document.createElement('div');
                layerElement.className = `flex items-center gap-2 p-2 rounded ${index === state.currentLayerIndex ? 'bg-primary/20 border border-primary' : 'hover:bg-gray-700'}`;
                
                // Visibility toggle
                const visibilityBtn = document.createElement('button');
                visibilityBtn.className = `p-1 rounded ${layer.visible ? 'text-accent' : 'text-gray-400'}`;
                visibilityBtn.innerHTML = layer.visible ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
                visibilityBtn.addEventListener('click', () => toggleLayerVisibility(index));
                
                // Layer name
                const layerName = document.createElement('span');
                layerName.className = 'flex-1 text-sm truncate';
                layerName.textContent = layer.name;
                
                // Delete button
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'p-1 text-red-400 hover:text-red-300';
                deleteBtn.innerHTML = '<i class="fas fa-trash"></i>';
                deleteBtn.addEventListener('click', () => deleteLayer(index));
                
                // Select layer on click
                layerElement.addEventListener('click', (e) => {
                    if (!e.target.closest('button')) {
                        selectLayer(index);
                    }
                });

                layerElement.appendChild(visibilityBtn);
                layerElement.appendChild(layerName);
                layerElement.appendChild(deleteBtn);
                layersList.appendChild(layerElement);
            });
        }

        // Add a new layer
        function addLayer() {
            const newLayerId = `layer-${Date.now()}`;
            const newLayerName = `Layer ${state.layers.length + 1}`;
            state.layers.push({
                id: newLayerId,
                name: newLayerName,
                visible: true,
                blocks: {}
            });
            selectLayer(state.layers.length - 1);
            saveStateToHistory();
            renderLayersList();
            updateStats();
        }

        // Delete a layer
        function deleteLayer(index) {
            if (state.layers.length <= 1) {
                alert('Cannot delete the last layer!');
                return;
            }
            
            state.layers.splice(index, 1);
            if (state.currentLayerIndex >= index) {
                selectLayer(Math.max(0, state.currentLayerIndex - 1));
            }
            saveStateToHistory();
            renderLayersList();
            render();
            updateStats();
        }

        // Toggle layer visibility
        function toggleLayerVisibility(index) {
            state.layers[index].visible = !state.layers[index].visible;
            saveStateToHistory();
            renderLayersList();
            render();
        }

        // Select a layer
        function selectLayer(index) {
            state.currentLayerIndex = index;
            renderLayersList();
            render();
            updateStats();
        }

        // Initialize Canvas Events
        function initCanvasEvents() {
            state.canvas.addEventListener('mousedown', startDrawing);
            state.canvas.addEventListener('mousemove', draw);
            state.canvas.addEventListener('mouseup', stopDrawing);
            state.canvas.addEventListener('contextmenu', (e) => e.preventDefault()); // Prevent right-click menu
        }

        // Start drawing/erasing
        function startDrawing(e) {
            if (e.button === 0) { // Left click - draw
                state.isDrawing = true;
                state.isErasing = false;
                drawAtMousePosition(e);
            } else if (e.button === 2) { // Right click - erase
                state.isDrawing = true;
                state.isErasing = true;
                drawAtMousePosition(e);
            }
        }

        // Draw/erase at mouse position
        function drawAtMousePosition(e) {
            if (!state.isDrawing) return;
            
            const rect = state.canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / GRID_SIZE);
            const y = Math.floor((e.clientY - rect.top) / GRID_SIZE);
            
            const currentLayer = state.layers[state.currentLayerIndex];
            const key = `${x},${y}`;
            
            if (state.isErasing) {
                if (currentLayer.blocks[key]) {
                    delete currentLayer.blocks[key];
                    saveStateToHistory();
                    render();
                    updateStats();
                }
            } else {
                if (currentLayer.blocks[key] !== state.selectedBlock) {
                    currentLayer.blocks[key] = state.selectedBlock;
                    saveStateToHistory();
                    render();
                    updateStats();
                }
            }
        }

        // Draw while moving mouse
        function draw(e) {
            if (state.isDrawing) {
                drawAtMousePosition(e);
            }
        }

        // Stop drawing/erasing
        function stopDrawing() {
            state.isDrawing = false;
            state.isErasing = false;
        }

        // Initialize Control Buttons
        function initControlButtons() {
            document.getElementById('exportBtn').addEventListener('click', exportBlueprint);
            document.getElementById('importFile').addEventListener('change', importBlueprint);
            document.getElementById('undoBtn').addEventListener('click', undo);
            document.getElementById('clearBtn').addEventListener('click', clearCanvas);
        }

        // Export blueprint to JSON
        function exportBlueprint() {
            const blueprint = {
                width: CANVAS_WIDTH / GRID_SIZE,
                height: CANVAS_HEIGHT / GRID_SIZE,
                gridSize: GRID_SIZE,
                layers: state.layers
            };
            
            const jsonString = JSON.stringify(blueprint, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `mc-blueprint-${new Date().toISOString().slice(0, 10)}.json`;
            a.click();
            
            URL.revokeObjectURL(url);
        }

        // Import blueprint from JSON
        function importBlueprint(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const blueprint = JSON.parse(event.target.result);
                    
                    // Validate blueprint structure
                    if (!blueprint.layers || !Array.isArray(blueprint.layers)) {
                        throw new Error('Invalid blueprint format');
                    }
                    
                    // Update state
                    state.layers = blueprint.layers;
                    state.currentLayerIndex = 0;
                    saveStateToHistory();
                    renderLayersList();
                    render();
                    updateStats();
                    
                    alert('Blueprint imported successfully!');
                } catch (error) {
                    alert('Error importing blueprint: ' + error.message);
                }
            };
            reader.readAsText(file);
        }

        // Undo last action
        function undo() {
            if (state.historyIndex > 0) {
                state.historyIndex--;
                restoreStateFromHistory();
                renderLayersList();
                render();
                updateStats();
            } else {
                alert('Nothing to undo!');
            }
        }

        // Clear canvas
        function clearCanvas() {
            if (confirm('Are you sure you want to clear the entire canvas?')) {
                state.layers.forEach(layer => {
                    layer.blocks = {};
                });
                saveStateToHistory();
                render();
                updateStats();
            }
        }

        // Save current state to history
        function saveStateToHistory() {
            // Create a deep copy of the layers state
            const stateCopy = JSON.parse(JSON.stringify(state.layers));
            
            // If we're in the middle of history, clear forward history
            if (state.historyIndex < state.history.length - 1) {
                state.history = state.history.slice(0, state.historyIndex + 1);
            }
            
            state.history.push(stateCopy);
            state.historyIndex = state.history.length - 1;
            
            // Limit history size to 50 steps
            if (state.history.length > 50) {
                state.history.shift();
                state.historyIndex--;
            }
        }

        // Restore state from history
        function restoreStateFromHistory() {
            if (state.historyIndex >= 0 && state.historyIndex < state.history.length) {
                state.layers = JSON.parse(JSON.stringify(state.history[state.historyIndex]));
            }
        }

        // Update statistics
        function updateStats() {
            let totalBlocks = 0;
            let currentLayerBlocks = 0;
            
            state.layers.forEach((layer, index) => {
                const count = Object.keys(layer.blocks).length;
                totalBlocks += count;
                if (index === state.currentLayerIndex) {
                    currentLayerBlocks = count;
                }
            });
            
            document.getElementById('stats').textContent = 
                `Total Blocks: ${totalBlocks} | Current Layer: ${currentLayerBlocks}`;
        }

        // Render the canvas
        function render() {
            const ctx = state.ctx;
            const canvas = state.canvas;
            
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid
            drawGrid(ctx, canvas.width, canvas.height);
            
            // Draw blocks from all visible layers
            state.layers.forEach(layer => {
                if (layer.visible) {
                    drawLayer(ctx, layer);
                }
            });
        }

        // Draw grid lines
        function drawGrid(ctx, width, height) {
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 1;
            
            // Vertical lines
            for (let x = 0; x <= width; x += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            
            // Horizontal lines
            for (let y = 0; y <= height; y += GRID_SIZE) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }
        }

        // Draw a single layer
        function drawLayer(ctx, layer) {
            const blocks = layer.blocks;
            Object.keys(blocks).forEach(key => {
                const [x, y] = key.split(',').map(Number);
                const blockId = blocks[key];
                const block = BLOCKS.find(b => b.id === blockId);
                
                if (block) {
                    ctx.fillStyle = block.color;
                    if (block.alpha) ctx.globalAlpha = block.alpha;
                    
                    ctx.fillRect(
                        x * GRID_SIZE,
                        y * GRID_SIZE,
                        GRID_SIZE - 1, // -1 for grid line visibility
                        GRID_SIZE - 1
                    );
                    
                    if (block.alpha) ctx.globalAlpha = 1.0;
                }
            });
        }

        // Start the application when the page loads
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
