<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线简历生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .container {
            display: flex;
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        /* 左侧表单 */
        .form-box {
            width: 40%;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 10px #00000015;
            height: fit-content;
        }
        .form-box h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .item {
            margin-bottom: 14px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input, textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size:14px;
        }
        textarea {
            min-height:80px;
            resize: vertical;
        }
        button {
            padding:10px 18px;
            background:#2c5282;
            color:#fff;
            border:none;
            border-radius:4px;
            cursor:pointer;
            margin-right:10px;
        }
        button:hover{background:#22426b;}
        /* 右侧简历预览 */
        .preview-box {
            width: 60%;
            background: #fff;
            padding:30px;
            box-shadow:0 2px 10px #00000015;
        }
        #resume {
            width: 100%;
        }
        .resume-header{
            display:flex;
            gap:20px;
            align-items:center;
            border-bottom:2px solid #2c5282;
            padding-bottom:15px;
            margin-bottom:20px;
        }
        #avatarImg{
            width:120px;
            height:120px;
            object-fit:cover;
            border-radius:6px;
            border:1px solid #ddd;
        }
        .base-info h1{
            font-size:28px;
            color:#222;
        }
        .section{
            margin-bottom:16px;
        }
        .section h3{
            color:#2c5282;
            border-left:4px solid #2c5282;
            padding-left:8px;
            margin-bottom:8px;
        }
        /* 手机适配 */
        @media (max-width:768px){
            .container{
                flex-direction:column;
            }
            .form-box,.preview-box{
                width:100%;
            }
        }
        @media print {
            .form-box, button {
                display:none !important;
            }
            .preview-box{
                box-shadow:none;
                padding:0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧输入表单 -->
        <div class="form-box">
            <h2>填写个人信息</h2>
            <div class="item">
                <label>头像图片</label>
                <input type="file" id="avatarInput" accept="image/*">
            </div>
            <div class="item">
                <label>姓名</label>
                <input type="text" id="name" placeholder="请输入姓名">
            </div>
            <div class="item">
                <label>联系电话</label>
                <input type="text" id="phone" placeholder="请输入电话">
            </div>
            <div class="item">
                <label>邮箱</label>
                <input type="text" id="email" placeholder="请输入邮箱">
            </div>
            <div class="item">
                <label>学历</label>
                <input type="text" id="edu" placeholder="例如：XX大学 信息与计算科学 本科">
            </div>
            <div class="item">
                <label>个人简介</label>
                <textarea id="intro" placeholder="简单介绍自己"></textarea>
            </div>
            <div class="item">
                <label>项目/实习经历</label>
                <textarea id="exp" placeholder="写项目、实习经历"></textarea>
            </div>
            <div class="item">
                <label>技能</label>
                <textarea id="skill" placeholder="例如Python、Vue、剪辑、海报设计"></textarea>
            </div>
            <button onclick="updateResume()">实时更新简历</button>
            <button onclick="printPDF()">导出PDF</button>
        </div>

        <!-- 简历预览区域 -->
        <div class="preview-box">
            <div id="resume">
                <div class="resume-header">
                    <img id="avatarImg" src="" alt="头像">
                    <div class="base-info">
                        <h1 id="resName">姓名</h1>
                        <p id="resPhone">电话：</p>
                        <p id="resEmail">邮箱：</p>
                        <p id="resEdu">学历：</p>
                    </div>
                </div>
                <div class="section">
                    <h3>个人简介</h3>
                    <p id="resIntro"></p>
                </div>
                <div class="section">
                    <h3>项目/实习经历</h3>
                    <p id="resExp"></p>
                </div>
                <div class="section">
                    <h3>专业技能</h3>
                    <p id="resSkill"></p>
                </div>
            </div>
        </div>
    </div>

<script>
    // 头像上传预览
    const avatarInput = document.getElementById('avatarInput');
    avatarInput.onchange = function(e){
        const file = e.target.files[0];
        if(file){
            const reader = new FileReader();
            reader.onload = function(ev){
                document.getElementById("avatarImg").src = ev.target.result;
            }
            reader.readAsDataURL(file);
        }
    }

    // 更新简历预览
    function updateResume(){
        document.getElementById("resName").innerText = document.getElementById("name").value || "姓名";
        document.getElementById("resPhone").innerText = "电话：" + (document.getElementById("phone").value || "");
        document.getElementById("resEmail").innerText = "邮箱：" + (document.getElementById("email").value || "");
        document.getElementById("resEdu").innerText = "学历：" + (document.getElementById("edu").value || "");
        document.getElementById("resIntro").innerText = document.getElementById("intro").value;
        document.getElementById("resExp").innerText = document.getElementById("exp").value;
        document.getElementById("resSkill").innerText = document.getElementById("skill").value;
    }

    // 打印导出PDF
    function printPDF(){
        window.print();
    }
</script>
</body>
</html>
